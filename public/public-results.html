<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Encuesta</title>
    <link rel="stylesheet" href="css/public-results.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="survey-header">
                <img class="formulario" src="images/form.svg" alt="Icono formulario">
                <h1 id="surveyTitle">Cargando resultados...</h1>
            </div>
        </header>

        <main class="main-content">
            <div class="results-container">
                <div id="resultsContent">
                    <!-- Los resultados se cargarán aquí dinámicamente -->
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Cargando resultados...</p>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2025 Ferchos Resultados Públicos</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/public-results.js"></script>
</body>
</html>
