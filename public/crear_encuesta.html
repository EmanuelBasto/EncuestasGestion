<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta Interactiva</title>
    <link rel="stylesheet" href="css/crear_encuesta.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="title-container">
                <img class="formulario" src="images/form.svg" alt="Icono formulario">
                <h1>Título para la encuesta</h1>
            </div>
            <nav>
                <ul>
                    <li>Preguntas</li>
                    <li onclick="window.location.href='respuestas_encuesta.html'">Respuestas</li>
                    <li onclick="window.location.href='compartir_encuesta.html'">Compartir</li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="backToSurveysBtn" class="back-btn">← Mis Encuestas</button>
                <button id="saveSurveyBtn" class="save-btn">💾 Guardar Encuesta</button>
            </div>
        </header>

        <main class="main-content">
            <div class="survey-column">
                <div class="survey-section">
                    <h2>Pregunta vacía</h2>
                    <div class="icon-container-top">
                        <img class="move" src="images/move.png" alt="icono mover">
                    </div>
                    <div class="options">
                        <div class="option">
                            <span>Opción 1</span>
                        </div>
                        <div class="option add-option">
                            <span>Añadir opción</span>
                        </div>
                    </div>
                    <div class="icon-container-bottom">
                        <img class="duplicate" src="images/duplicar.png" alt="duplicar">
                        <img class="trash" src="images/trash.png" alt="eliminar">
                    </div>
                    <button class="add-question-btn">Añadir pregunta</button>
                </div>

                <hr>

                <div class="survey-section">
                    <h2>Pregunta vacía</h2>
                    <div class="icon-container-top">
                        <img class="move" src="images/move.png" alt="icono mover">
                    </div>
                    <p class="instruction">La primera letra de tu respuesta debe ser mayúscula.</p>
                    <div class="icon-container-bottom">
                        <img class="duplicate" src="images/duplicar.png" alt="duplicar">
                        <img class="trash" src="images/trash.png" alt="eliminar">
                    </div>
                    <button class="add-question-btn">Añadir pregunta</button>
                </div>
            </div>

        </main>
    </div>

    <script src="js/crear_encuesta.js"></script>
</body>
</html>
