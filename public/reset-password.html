<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Sistema de Encuestas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Modal de Reset de Contraseña -->
        <div class="modal" id="resetModal" style="display: flex;">
            <div class="modal-content fade-in">
                <div class="modal-header">
                    <h2 class="modal-title">Restablecer contraseña</h2>
                </div>
                
                <form id="resetForm">
                    <div class="form-group">
                        <label for="password" class="form-label">
                            Nueva contraseña <span class="required">(obligatorio)*</span>
                        </label>
                        <div class="input-group">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input" 
                                placeholder="Nueva contraseña (mínimo 6 caracteres)"
                                required
                                minlength="6"
                            >
                            <span class="icon-eye" id="togglePassword">👁️</span>
                        </div>
                        <div class="error-message" id="passwordError"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">
                            Confirmar contraseña <span class="required">(obligatorio)*</span>
                        </label>
                        <div class="input-group">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                class="form-input" 
                                placeholder="Confirma contraseña"
                                required
                                minlength="6"
                            >
                            <span class="icon-eye" id="toggleConfirmPassword">👁️</span>
                        </div>
                        <div class="error-message" id="confirmPasswordError"></div>
                    </div>

                    <button type="submit" class="btn-primary" id="resetBtn">
                        Aceptar
                    </button>

                <div class="form-links">
                    <a href="/login" class="form-link">
                        Regresar al inicio
                    </a>
                </div>

                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Obtener token de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            // Si no hay token, redirigir al login
            window.location.href = '/login';
        } else {
            // Validar token con el servidor
            validateResetToken(token);
        }
        
        async function validateResetToken(token) {
            try {
                const response = await fetch(`/api/auth/validate-reset-token?token=${token}`);
                const data = await response.json();
                
                if (!data.ok) {
                    alert('Token inválido o expirado');
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error validando token:', error);
                alert('Error validando el token');
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
