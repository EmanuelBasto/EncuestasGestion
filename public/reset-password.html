<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Sistema de Encuestas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Modal de Reset de Contraseña -->
        <div class="modal" id="resetModal" style="display: flex;">
            <div class="modal-content fade-in">
                <div class="modal-header">
                    <h2 class="modal-title">Restablecer contraseña</h2>
                </div>
                
                <form id="resetForm">
                    <div class="form-group">
                        <label for="password" class="form-label">
                            Nueva contraseña <span class="required">(obligatorio)*</span>
                        </label>
                        <div class="input-group">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input" 
                                placeholder="Nueva contraseña (mínimo 6 caracteres)"
                                required
                                minlength="6"
                            >
                            <span class="icon-eye" id="togglePassword">👁️</span>
                        </div>
                        <div class="error-message" id="passwordError"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">
                            Confirmar contraseña <span class="required">(obligatorio)*</span>
                        </label>
                        <div class="input-group">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                class="form-input" 
                                placeholder="Confirma contraseña"
                                required
                                minlength="6"
                            >
                            <span class="icon-eye" id="toggleConfirmPassword">👁️</span>
                        </div>
                        <div class="error-message" id="confirmPasswordError"></div>
                    </div>

                    <button type="submit" class="btn-primary" id="resetBtn">
                        Aceptar
                    </button>

                <div class="form-links">
                    <a href="/login" class="form-link">
                        Regresar al inicio
                    </a>
                </div>

                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Obtener token de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            // Si no hay token, redirigir al login
            window.location.href = '/login';
        } else {
            // Validar token con el servidor inicialmente
            validateResetToken(token);
            
            // Verificar token cada 5 segundos para detectar si fue invalidado
            const tokenCheckInterval = setInterval(async () => {
                const isValid = await validateResetToken(token, false);
                if (!isValid) {
                    clearInterval(tokenCheckInterval);
                    showTokenInvalidMessage();
                }
            }, 5000);
        }
        
        async function validateResetToken(token, showAlert = true) {
            try {
                const response = await fetch(`/api/auth/validate-reset-token?token=${token}`);
                const data = await response.json();
                
                if (!data.ok) {
                    if (showAlert) {
                        alert('Token inválido o expirado');
                        window.location.href = '/login';
                    }
                    return false;
                }
                return true;
            } catch (error) {
                console.error('Error validando token:', error);
                if (showAlert) {
                    alert('Error validando el token');
                    window.location.href = '/login';
                }
                return false;
            }
        }
        
        function showTokenInvalidMessage() {
            // Crear modal de error
            const errorOverlay = document.createElement('div');
            errorOverlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.7);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 10000;
            `;
            
            const errorBox = document.createElement('div');
            errorBox.style.cssText = `
                background-color: white;
                padding: 30px;
                border-radius: 10px;
                text-align: center;
                max-width: 400px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            `;
            
            errorBox.innerHTML = `
                <h2 style="color: #dc3545; margin-bottom: 15px;">⚠️ Token Inválido</h2>
                <p style="color: #333; margin-bottom: 20px;">
                    Se ha solicitado un nuevo correo de recuperación de contraseña.<br>
                    Este enlace ya no es válido.
                </p>
                <p style="color: #666; margin-bottom: 20px; font-size: 14px;">
                    Por favor, revisa tu correo para el nuevo enlace.
                </p>
                <button onclick="location.reload()" style="
                    background-color: #007bff;
                    color: white;
                    border: none;
                    padding: 10px 20px;
                    border-radius: 5px;
                    cursor: pointer;
                    font-size: 16px;
                ">
                    Recargar Página
                </button>
            `;
            
            errorOverlay.appendChild(errorBox);
            document.body.appendChild(errorOverlay);
        }
    </script>
</body>
</html>
