<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Encuesta</title>
    <link rel="stylesheet" href="css/respuestas_encuesta.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="title-container">
                <img class="formulario" src="images/form.svg" alt="Icono formulario">
                <h1>Título para la encuesta</h1>
            </div>
            <nav>
                <ul>
                    <li onclick="goToQuestions()">Preguntas</li>
                    <li>Respuestas</li>
                    <li onclick="goToShare()">Compartir</li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="backToSurveysBtn" class="back-btn">← Mis Encuestas</button>
                <div class="refresh-indicator">
                    <span class="refresh-text">Actualización automática cada 30s</span>
                    <div class="refresh-dot"></div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="dashboard-container">
                <!-- El dashboard se cargará aquí dinámicamente -->
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Cargando resultados...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/respuestas_encuesta.js"></script>
</body>
</html>
