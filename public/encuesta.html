<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Encuestas</title>
    <link rel="stylesheet" href="css/encuesta.css">
</head>
<body>
    <header>
        <h1>Mis Encuestas</h1>
        <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
    </header>
    
    <main>
        <div class="create-section">
            <p class="instruccion">Selecciona el botón azul para crear una encuesta:</p>
            <button class="boton-add">
                <img src="images/add.svg" alt="Crear encuesta">
            </button>
            <p>Encuesta en blanco</p>
        </div>

        <div class="surveys-section">
            <h3>Mis encuestas:</h3>
            <div class="surveys-container">
                <!-- Las encuestas se cargarán aquí dinámicamente -->
            </div>
        </div>
    </main>

    <script src="js/encuesta.js"></script>
</body>
</html>
