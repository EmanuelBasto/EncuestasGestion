<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación de encuestas anónimas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&family=Amiri:wght@400&family=Inter:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <h1 class="main-title">Creación de encuestas anónimas</h1>
        <div class="container">
            <!-- Formulario de Login -->
            <div class="form-card fade-in">
                <div class="form-header">
                    <h1 class="form-title">Iniciar sesión</h1>
                    <img src="images/head.pgn" alt="Login Icon" class="form-icon">
                </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Correo</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="correo"
                        required
                    >
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="contraseña"
                            required
                        >
                        <img src="images/eye-hidden-icon.svg" alt="Mostrar/Ocultar contraseña" class="icon-eye" id="togglePassword">
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    Acceder
                </button>

                <div class="form-links">
                    <a href="#" class="form-link" id="forgotPasswordLink">
                        ¿Has perdido tu contraseña?
                    </a>
                    <a href="register.html" class="form-link">
                        ¿No tienes cuenta? Regístrate aquí
                    </a>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
            </form>
        </div>

            <!-- Ilustración lateral -->
            <div class="illustration">
                <div class="illustration-content">
                    <div class="illustration-image">
                        <img src="images/main-illustration.jpg" alt="Ilustración de persona con checklist" class="main-illustration">
                    </div>
                    
                    <!-- Estrellas de calificación -->
                    <div class="rating-stars">
                        <img src="images/star-icon1.jpg" alt="Estrella" class="star">
                        <img src="images/star-icon2.jpg" alt="Estrella" class="star">
                        <img src="images/star-icon1.jpg" alt="Estrella" class="star">
                        <img src="images/star-icon2.jpg" alt="Estrella" class="star">
                        <img src="images/star-icon1.jpg" alt="Estrella" class="star">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para reset de contraseña -->
    <div id="resetModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="closeModal">&times;</span>
            <div class="modal-header">
                <h2 class="modal-title">Restablecer contraseña</h2>
            </div>
            
            <form id="resetForm">
                <div class="form-group">
                    <label for="resetEmail" class="form-label">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="resetEmail" 
                        name="email" 
                        class="form-input" 
                        placeholder="tu@correo.com"
                        required
                    >
                    <div class="error-message" id="resetEmailError"></div>
                </div>

                <button type="submit" class="btn-primary" id="resetBtn">
                    Enviar enlace de recuperación
                </button>

                <div class="loading" id="resetLoading">
                    <div class="spinner"></div>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
