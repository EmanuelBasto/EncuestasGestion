<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responder Encuesta</title>
    <link rel="stylesheet" href="css/public-survey.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="survey-header">
                <img class="formulario" src="images/form.svg" alt="Icono formulario">
                <h1 id="surveyTitle">Cargando encuesta...</h1>
            </div>
        </header>

        <main class="main-content">
            <div class="survey-form-container">
                <form id="surveyForm">
                    <div id="questionsContainer">
                        <!-- Las preguntas se cargarán aquí dinámicamente -->
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>Cargando preguntas...</p>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" id="submitBtn" class="submit-btn" disabled>
                            📤 Enviar Respuestas
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <footer>
            <p>© 2024 Sistema de Encuestas - Respuesta Anónima</p>
        </footer>
    </div>

    <script src="js/public-survey.js"></script>
</body>
</html>
