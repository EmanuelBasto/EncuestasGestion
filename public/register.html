<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Sistema de Encuestas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&family=Amiri:wght@400&family=Inter:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="register-container">
        <!-- Formulario de Registro -->
        <div class="register-form-card fade-in">
            <h1 class="register-title">Crear cuenta</h1>

            <form id="registerForm">
                <div class="form-group">
                    <label for="nombre" class="form-label">
                        Nombre completo <span class="required">(obligatorio)*</span>
                    </label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        class="form-input" 
                        placeholder="Tu nombre"
                        required
                    >
                    <div class="error-message" id="nombreError"></div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">
                        Correo electrónico <span class="required">(obligatorio)*</span>
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="Correo"
                        required
                    >
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        Nueva contraseña <span class="required">(obligatorio)*</span>
                    </label>
                    <div class="input-group">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Nueva contraseña (mínimo 6 caracteres)"
                            required
                            minlength="6"
                        >
                        <img src="images/eye-hidden-icon.svg" alt="Mostrar/Ocultar contraseña" class="icon-eye" id="togglePassword">
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">
                        Nueva contraseña <span class="required">(obligatorio)*</span>
                    </label>
                    <div class="input-group">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            class="form-input" 
                            placeholder="Confirma contraseña"
                            required
                            minlength="6"
                        >
                        <img src="images/eye-hidden-icon.svg" alt="Mostrar/Ocultar contraseña" class="icon-eye" id="toggleConfirmPassword">
                    </div>
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>

                <button type="submit" class="btn-primary" id="registerBtn">
                    Registrarse
                </button>

                <div class="form-links">
                    <a href="/login" class="form-link">
                        ¿Ya tienes cuenta? Inicia aquí
                    </a>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
